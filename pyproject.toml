[project]
name = "Transformer"
version = "0.1.0"
description = "Attention Is All You Need"
requires-python = ">=3.12"
license = [{ text = "Apache-2.0" }]
dependencies = ["torch>=2.13.0"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.urls]
"Homepage" = "https://transformer.github.io"
"Repository" = "https://github.com/Aporifold/transformer"
"Bug Tracker" = "https://github.com/Aporifold/transformer/issues"
